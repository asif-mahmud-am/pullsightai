name: Deploy with Self-Hosted Runner

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cd backend
          cat << EOF > .env
          NODE_ENV=${{ vars.NODE_ENV }}
          PORT=${{ vars.PORT }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          CLIENT_URL=${{ vars.CLIENT_URL }}
          BASE_URL=${{ vars.BASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          GITLAB_CLIENT_ID=${{ secrets.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET=${{ secrets.GITLAB_CLIENT_SECRET }}
          BITBUCKET_CLIENT_ID=${{ secrets.BITBUCKET_CLIENT_ID }}
          BITBUCKET_CLIENT_SECRET=${{ secrets.BITBUCKET_CLIENT_SECRET }}
          GITHUB_CLIENT_ID=${{ secrets.GIT_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GIT_CLIENT_SECRET }}
          AI_AGENT_PR_POST_URL=${{ vars.AI_AGENT_PR_POST_URL }}
          AI_AGENT_PR_REVIEW_URL=${{ vars.AI_AGENT_PR_REVIEW_URL }}
          GITHUB_WEBHOOK_SECRET=${{ secrets.GIT_WEBHOOK_SECRET }}
          GITHUB_PRIVATE_KEY_PATH=${{ secrets.GIT_PRIVATE_KEY_PATH }}
          GITHUB_APP_SLUG=${{ secrets.GIT_APP_SLUG }}
          GITHUB_APP_ID=${{ secrets.GIT_APP_ID }}
          DOMAIN=${{ vars.DOMAIN }}
          EOF

      - name: Create AI Agent .env file
        run: |
          cd ai_agent
          cat << EOF > .env
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          BACKEND_BASE_URL=${{ vars.BACKEND_BASE_URL }}
          BACKEND_SUMMARY_ENDPOINT=${{ vars.BACKEND_SUMMARY_ENDPOINT }}
          BACKEND_REVIEW_ENDPOINT=${{ vars.BACKEND_REVIEW_ENDPOINT }}
          EOF

      - name: Create Frontend .env file
        run: |
          cd frontend
          cat << EOF > .env
          NODE_ENV=${{ vars.NEXT_NODE_ENV }}
          NEXT_TELEMETRY_DISABLED=${{ vars.NEXT_TELEMETRY_DISABLED }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Create PEM file
        run: |
          echo "${{ secrets.GIT_PRIVATE_KEY }}" > backend/app.private-key.pem
          chmod 600 backend/app.private-key.pem

      - name: Create PEM file
        run: |
          echo "${{ secrets.GIT_PRIVATE_KEY }}" > backend/app.private-key.pem
          chmod 600 backend/app.private-key.pem

      - name: Deploy with Docker Compose
        env:
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
          BITBUCKET_CLIENT_ID: ${{ secrets.BITBUCKET_CLIENT_ID }}
          BITBUCKET_CLIENT_SECRET: ${{ secrets.BITBUCKET_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          AI_AGENT_PR_POST_URL: ${{ vars.AI_AGENT_PR_POST_URL }}
          AI_AGENT_PR_REVIEW_URL: ${{ vars.AI_AGENT_PR_REVIEW_URL }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GIT_WEBHOOK_SECRET }}
          GITHUB_PRIVATE_KEY_PATH: ${{ secrets.GIT_PRIVATE_KEY_PATH }}
          GITHUB_APP_SLUG: ${{ secrets.GIT_APP_SLUG }}
          GITHUB_APP_ID: ${{ secrets.GIT_APP_ID }}
          DOMAIN: ${{ vars.DOMAIN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          BACKEND_SUMMARY_ENDPOINT: ${{ vars.BACKEND_SUMMARY_ENDPOINT }}
          BACKEND_REVIEW_ENDPOINT: ${{ vars.BACKEND_REVIEW_ENDPOINT }}
          NEXT_NODE_ENV: ${{ vars.NEXT_NODE_ENV }}
          NEXT_TELEMETRY_DISABLED: ${{ vars.NEXT_TELEMETRY_DISABLED }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker compose up --build -d

      - name: Clean up Docker resources
        run: |
          docker system prune -a --volumes -f

      - name: Show service status and logs
        run: |
          docker compose ps
          echo "=== Backend Logs ==="
          docker compose logs pullsightai-backend --tail=20
          echo "=== Frontend Logs ==="
          docker compose logs pullsightai-frontend --tail=20
          echo "=== AI Agent Logs ==="
          docker compose logs pullsightai-ai-agent --tail=20
